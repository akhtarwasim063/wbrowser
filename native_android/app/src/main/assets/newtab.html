<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New tab</title>
<style>
  :root { color-scheme: light dark;
    --bg:#eaf0ff; --fg:#1a1c27; --muted:#5a5f73; --card:rgba(255,255,255,.62); --line:rgba(255,255,255,.9); --pri:#4f46e5; --b1:#7c83ff; --b2:#22d3ee; --b3:#f0a6ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0d18; --fg:#e7e9f4; --muted:#a3a9bd; --card:rgba(255,255,255,.08); --line:rgba(255,255,255,.18); --pri:#8f96ff; --b1:#4f46e5; --b2:#0891b2; --b3:#a21caf; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background:var(--bg); }
  html, body { margin:0; height:100%; overflow-x:hidden; color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body::before, body::after { content:""; position:fixed; z-index:-1; border-radius:50%; filter:blur(60px); opacity:.55; animation:drift 14s ease-in-out infinite alternate; }
  body::before { width:60vw; height:60vw; left:-15vw; top:-10vw; background:var(--b1); }
  body::after { width:55vw; height:55vw; right:-15vw; bottom:5vh; background:var(--b2); animation-delay:-6s; }
  @keyframes drift { to { transform:translate(8vw,6vh) scale(1.12); } }
  @media (prefers-reduced-motion:reduce) { body::before, body::after { animation:none; } }
  main { min-height:100%; display:flex; flex-direction:column; align-items:center; padding:12vh 20px 40px; }
  .logo { width:84px; height:84px; border-radius:24px; display:grid; place-items:center;
    background:linear-gradient(135deg,#4f46e5,#06b6d4); box-shadow:0 10px 30px rgba(79,70,229,.35); }
  h1 { margin:18px 0 4px; font-size:30px; letter-spacing:.3px; }
  p.tag { margin:0 0 28px; color:var(--muted); font-size:14px; }
  form { width:100%; max-width:560px; }
  .box { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:28px; padding:0 18px; height:54px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 8px 28px rgba(79,70,229,.14); }
  .box:focus-within { border-color:var(--pri); }
  input { flex:1; border:0; outline:0; background:transparent; color:var(--fg); font-size:16px; height:100%; }
  .tiles { margin-top:34px; display:grid; grid-template-columns:repeat(4,1fr); gap:18px 12px; width:100%; max-width:560px; }
  a.tile { text-decoration:none; color:var(--fg); display:flex; flex-direction:column; align-items:center; gap:8px; font-size:12px; }
  .ico { width:56px; height:56px; border-radius:18px; display:grid; place-items:center; color:#fff;
    font-weight:700; font-size:22px; }
  .shield { margin-top:36px; padding:8px 14px; border-radius:20px; background:var(--card); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); display:flex; gap:8px; align-items:center; color:var(--muted); font-size:13px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#16a34a; }
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg width="52" height="52" viewBox="0 0 108 108" fill="none" stroke="#fff" stroke-width="9"
         stroke-linecap="round" stroke-linejoin="round"><path d="M22,34L36,76L54,44L72,76L86,34"/></svg>
  </div>
  <h1>WBrowser</h1>
  <p class="tag">Fast. Private. Ad-free.</p>
  <form id="f">
    <div class="box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color:var(--muted)"><path d="M15.5,14h-0.79l-0.28,-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zM9.5,14C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z"/></svg>
      <input id="q" type="text" placeholder="Search or type URL" autocomplete="off" autocapitalize="off" enterkeyhint="go">
    </div>
  </form>
  <div class="tiles" id="tiles"></div>
  <div class="shield"><span class="dot"></span> Shields active: ads, trackers and pop-ups blocked</div>
</main>
<script>
  // The app passes the search URL template in the hash: newtab.html#<encoded template with %s>
  var tpl = decodeURIComponent((location.hash || '').slice(1)) || 'https://www.google.com/search?q=%s';
  var sites = [
    ['YouTube','https://m.youtube.com','#e11d48'], ['Google','https://www.google.com','#2563eb'],
    ['Wikipedia','https://en.m.wikipedia.org','#475569'], ['GitHub','https://github.com','#1f2937'],
    ['Reddit','https://www.reddit.com','#ea580c'], ['X','https://x.com','#0f172a'],
    ['Amazon','https://www.amazon.in','#d97706'], ['News','https://news.google.com','#0d9488']
  ];
  var t = document.getElementById('tiles');
  sites.forEach(function (s) {
    var a = document.createElement('a'); a.className = 'tile'; a.href = s[1];
    a.innerHTML = '<div class="ico" style="background:' + s[2] + '">' + s[0][0] + '</div><span>' + s[0] + '</span>';
    t.appendChild(a);
  });
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (!v) return;
    if (/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) location.href = v;
    else if (v.indexOf(' ') < 0 && v.indexOf('.') > 0) location.href = 'https://' + v;
    else location.href = tpl.replace('%s', encodeURIComponent(v));
  });
</script>
</body>
</html>
